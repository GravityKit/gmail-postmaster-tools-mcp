name: Build and Release MCPB

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22"

      - name: Run tests
        run: npm test

      - name: Check the tag matches the manifest
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          MANIFEST_VERSION="$(jq -r .version manifest.json)"
          test "$TAG_VERSION" = "$MANIFEST_VERSION"

      - name: Validate manifest
        run: npx --yes @anthropic-ai/mcpb@2.1.2 validate manifest.json

      - name: Pack bundle
        run: npx --yes @anthropic-ai/mcpb@2.1.2 pack . gmail-postmaster-tools.mcpb

      - name: Attach bundle to release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: gmail-postmaster-tools.mcpb
          generate_release_notes: true
